[package]
name = "telltale-systemone"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Reference Telltale analyzer.v1 extension that evaluates guard packs with a System One model"
publish = false

[[bin]]
name = "telltale-systemone"
path = "src/main.rs"

[dependencies]
regex = "1.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
serde_yaml = "0.9"
sha2 = "0.10"
ureq = { version = "3.4", default-features = false, features = ["rustls"] }

[dev-dependencies]
jsonschema = { version = "0.29", default-features = false }
